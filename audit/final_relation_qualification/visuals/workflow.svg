<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1530 960" role="img" aria-label="SanadSquad final LangGraph workflow"><rect width="1530" height="960" fill="#071321"/><text x="34" y="46" fill="#e8f3ff" font-family="system-ui" font-size="28" font-weight="700">Six independent slots · one shared Ollama limit</text><text x="34" y="75" fill="#afc6dc" font-family="system-ui" font-size="15">Trusted instructions remain separate from dynamic evidence. Dashed paths are conditional.</text><g data-node="inputs" tabindex="0" role="button" aria-label="Validated inputs"><rect x="34" y="112" width="340" height="113" rx="17" fill="#12283e" stroke="#81a6ff" stroke-width="2"/><rect x="34" y="112" width="340" height="7" rx="4" fill="#81a6ff"/><text x="52" y="158" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Validated inputs</text><text x="52" y="189" fill="#b8cfe2" font-family="system-ui" font-size="14">plan · brand · KB · registry</text></g><path d="M378 168 H404" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="fanout" tabindex="0" role="button" aria-label="LangGraph fan-out"><rect x="409" y="112" width="340" height="113" rx="17" fill="#12283e" stroke="#81a6ff" stroke-width="2"/><rect x="409" y="112" width="340" height="7" rx="4" fill="#81a6ff"/><text x="427" y="158" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">LangGraph fan-out</text><text x="427" y="189" fill="#b8cfe2" font-family="system-ui" font-size="14">one Send per slot</text></g><path d="M753 168 H779" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="research" tabindex="0" role="button" aria-label="Research"><rect x="784" y="112" width="340" height="113" rx="17" fill="#12283e" stroke="#56c9e8" stroke-width="2"/><rect x="784" y="112" width="340" height="7" rx="4" fill="#56c9e8"/><text x="802" y="158" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Research</text><text x="802" y="189" fill="#b8cfe2" font-family="system-ui" font-size="14">shared EvidenceLookup</text></g><path d="M1128 168 H1154" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="writer" tabindex="0" role="button" aria-label="Registered Writer"><rect x="1159" y="112" width="340" height="113" rx="17" fill="#12283e" stroke="#56c9e8" stroke-width="2"/><rect x="1159" y="112" width="340" height="7" rx="4" fill="#56c9e8"/><text x="1177" y="158" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Registered Writer</text><text x="1177" y="189" fill="#b8cfe2" font-family="system-ui" font-size="14">paraphrase pinned evidence</text></g><path d="M1329 228 V279 H204" fill="none" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="extract" tabindex="0" role="button" aria-label="Claim extraction"><rect x="34" y="284" width="340" height="113" rx="17" fill="#12283e" stroke="#f6bd69" stroke-width="2"/><rect x="34" y="284" width="340" height="7" rx="4" fill="#f6bd69"/><text x="52" y="330" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Claim extraction</text><text x="52" y="361" fill="#b8cfe2" font-family="system-ui" font-size="14">atomic facts · qualifiers</text></g><path d="M378 340 H404" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="provenance" tabindex="0" role="button" aria-label="Pinned provenance"><rect x="409" y="284" width="340" height="113" rx="17" fill="#12283e" stroke="#f6bd69" stroke-width="2"/><rect x="409" y="284" width="340" height="7" rx="4" fill="#f6bd69"/><text x="427" y="330" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Pinned provenance</text><text x="427" y="361" fill="#b8cfe2" font-family="system-ui" font-size="14">hash · quote · offsets</text></g><path d="M753 340 H779" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="context" tabindex="0" role="button" aria-label="Source context"><rect x="784" y="284" width="340" height="113" rx="17" fill="#12283e" stroke="#f6bd69" stroke-width="2"/><rect x="784" y="284" width="340" height="7" rx="4" fill="#f6bd69"/><text x="802" y="330" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Source context</text><text x="802" y="361" fill="#b8cfe2" font-family="system-ui" font-size="14">bounded pinned windows</text></g><path d="M1128 340 H1154" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="roles" tabindex="0" role="button" aria-label="Evidence-role classification"><rect x="1159" y="284" width="340" height="113" rx="17" fill="#12283e" stroke="#f6bd69" stroke-width="2"/><rect x="1159" y="284" width="340" height="7" rx="4" fill="#f6bd69"/><text x="1177" y="330" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Evidence-role classification</text><text x="1177" y="361" fill="#b8cfe2" font-family="system-ui" font-size="14">normative · causal · descriptive</text></g><path d="M1329 400 V451 H204" fill="none" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="relation" tabindex="0" role="button" aria-label="Claim-relation verification"><rect x="34" y="456" width="340" height="113" rx="17" fill="#12283e" stroke="#56c9e8" stroke-width="2"/><rect x="34" y="456" width="340" height="7" rx="4" fill="#56c9e8"/><text x="52" y="502" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Claim-relation verification</text><text x="52" y="533" fill="#b8cfe2" font-family="system-ui" font-size="14">entailment · syntax veto</text></g><path d="M378 512 H404" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="skeptic" tabindex="0" role="button" aria-label="Skeptical evaluation"><rect x="409" y="456" width="340" height="113" rx="17" fill="#12283e" stroke="#56c9e8" stroke-width="2"/><rect x="409" y="456" width="340" height="7" rx="4" fill="#56c9e8"/><text x="427" y="502" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Skeptical evaluation</text><text x="427" y="533" fill="#b8cfe2" font-family="system-ui" font-size="14">independent second pass</text></g><path d="M753 512 H779" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="evaluate" tabindex="0" role="button" aria-label="Rules + Reviewer approval"><rect x="784" y="456" width="340" height="113" rx="17" fill="#12283e" stroke="#56c9e8" stroke-width="2"/><rect x="784" y="456" width="340" height="7" rx="4" fill="#56c9e8"/><text x="802" y="502" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Rules + Reviewer approval</text><text x="802" y="533" fill="#b8cfe2" font-family="system-ui" font-size="14">hard gates · six scores</text></g><path d="M1128 512 H1154" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="decision" tabindex="0" role="button" aria-label="Approval decision"><rect x="1159" y="456" width="340" height="113" rx="17" fill="#12283e" stroke="#f6bd69" stroke-width="2"/><rect x="1159" y="456" width="340" height="7" rx="4" fill="#f6bd69"/><text x="1177" y="502" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Approval decision</text><text x="1177" y="533" fill="#b8cfe2" font-family="system-ui" font-size="14">one revision maximum</text></g><path d="M1329 572 V623 H204" fill="none" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="visual" tabindex="0" role="button" aria-label="Visual specification"><rect x="34" y="628" width="340" height="113" rx="17" fill="#12283e" stroke="#44d6ad" stroke-width="2"/><rect x="34" y="628" width="340" height="7" rx="4" fill="#44d6ad"/><text x="52" y="674" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Visual specification</text><text x="52" y="705" fill="#b8cfe2" font-family="system-ui" font-size="14">accepted content only</text></g><path d="M378 684 H404" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="aggregate" tabindex="0" role="button" aria-label="Plan-order results"><rect x="409" y="628" width="340" height="113" rx="17" fill="#12283e" stroke="#81a6ff" stroke-width="2"/><rect x="409" y="628" width="340" height="7" rx="4" fill="#81a6ff"/><text x="427" y="674" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Plan-order results</text><text x="427" y="705" fill="#b8cfe2" font-family="system-ui" font-size="14">isolated slot failures</text></g><path d="M753 684 H779" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="acceptance" tabindex="0" role="button" aria-label="Final acceptance gate"><rect x="784" y="628" width="340" height="113" rx="17" fill="#12283e" stroke="#44d6ad" stroke-width="2"/><rect x="784" y="628" width="340" height="7" rx="4" fill="#44d6ad"/><text x="802" y="674" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Final acceptance gate</text><text x="802" y="705" fill="#b8cfe2" font-family="system-ui" font-size="14">relation recheck · review</text></g><path d="M1128 684 H1154" stroke="#7b9bb7" stroke-width="3" marker-end="url(#arrow)"/><g data-node="export" tabindex="0" role="button" aria-label="Audit + accepted CSV"><rect x="1159" y="628" width="340" height="113" rx="17" fill="#12283e" stroke="#44d6ad" stroke-width="2"/><rect x="1159" y="628" width="340" height="7" rx="4" fill="#44d6ad"/><text x="1177" y="674" fill="#f2f8ff" font-family="system-ui" font-size="19" font-weight="700">Audit + accepted CSV</text><text x="1177" y="705" fill="#b8cfe2" font-family="system-ui" font-size="14">spec: path · no publishing</text></g><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#7b9bb7" stroke-width="2"/></marker></defs><path d="M1329 574 H1515 V170 H1504" fill="none" stroke="#f6bd69" stroke-width="3" stroke-dasharray="9 7"/><text x="1170" y="854" fill="#f6bd69" font-family="system-ui" font-size="15">first rejection → one revision</text><text x="36" y="912" fill="#ff899b" font-family="system-ui" font-size="15">Second rejection → dropped; agent error → failed. Both aggregate without a visual spec or CSV row.</text><text x="36" y="940" fill="#b9c9dc" font-family="system-ui" font-size="15">SystemMessage: versioned instructions · HumanMessage: untrusted source quotations and task data</text></svg>
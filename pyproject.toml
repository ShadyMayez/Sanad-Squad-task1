[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandsquad"
version = "0.1.0"
description = "SanadSquad Smart Contract Security Content Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.6",
    "langchain-core>=1.6.10",
    "langgraph>=1.2.15",
    "langchain-ollama>=1.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]
